apiVersion: v1
kind: Pod
metadata:
  name: grid-telemetry-collector
spec:
  containers:
  - name: collector
    image: ecopower/collector:v1
    env:
    - name: INFLUXDB_ADMIN_TOKEN
      value: "influx_super_admin_token_prod_99112233"
    - name: AWS_SNS_TOPIC_ARN
      value: "arn:aws:sns:us-east-1:123456789012:GridAlertsTopic"
